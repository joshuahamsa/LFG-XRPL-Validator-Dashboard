<!DOCTYPE html>
<!--
  ⚠ MIRROR REQUIRED — this file is NOT what gets served.

  The live page at https://joshuahamsa.com/validator.html is served from a
  separate repo: joshuahamsa/joshuahamsa.github.io (validator.html at its root).
  This copy is the source of truth for development; that copy is the deploy
  target. Editing only this one changes nothing that users see.

  After changing this file, apply the same change there, then verify:
    gh api repos/joshuahamsa/joshuahamsa.github.io/pages/builds/latest --jq .status
    curl -s "https://joshuahamsa.com/validator.html?cb=$(date +%s)" | grep <your-change>

  Apply changes deliberately rather than copying the file wholesale — the two
  have deliberately diverged (METRICS_URL value/comment, and the
  "METRICS_URL not configured" guard which only exists here).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XRPL Validator — Joshua Hamsa</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <div class="container">
    <header>
      <div class="terminal-header">
        <div class="terminal-buttons">
          <span class="terminal-button"></span>
          <span class="terminal-button"></span>
          <span class="terminal-button"></span>
        </div>
        <div class="terminal-title">joshuahamsa.com/validator.html</div>
      </div>

      <div class="blog-nav">
        <a href="/" class="terminal-link"><span class="prompt" aria-hidden="true"><span class="prompt-char">❯</span></span> cd ..</a>
        <a href="/blog/home-validator.html" class="terminal-link"><span class="prompt" aria-hidden="true"><span class="prompt-char">❯</span></span> cat blog/home-validator.md</a>
      </div>
    </header>

    <main>
      <div id="val-offline" class="val-offline" style="display:none">
        <span class="val-red">[OFFLINE]</span> last seen: <span id="val-last-seen">—</span>
      </div>
      <pre id="val-pre" class="val-pre">connecting...</pre>
      <pre id="amd-pre" class="val-pre">connecting...</pre>
      <div id="val-footer" class="val-footer val-dim">updated — · refreshing every 5s</div>
    </main>
  </div>

  <script>
    const METRICS_URL = ''; // set by setup.sh — run: bash motd/setup.sh
    const FETCH_INTERVAL_MS = 5000;
    const FETCH_TIMEOUT_MS = 4000;

    let lastData = null;
    let lastSeenAt = null;

    // Right-pad an HTML string to `width` visible characters.
    // Strips HTML tags before measuring so color spans don't inflate the count.
    function rpad(html, width) {
      const visible = html.replace(/<[^>]*>/g, '');
      return html + ' '.repeat(Math.max(0, width - visible.length));
    }

    // Clip plain text to `width` visible chars, marking overflow with an ellipsis.
    // Counterpart to rpad(): rpad only pads, so anything wider than its column
    // silently widens the row and pushes the right-hand column out of alignment.
    function clip(text, width) {
      const s = String(text);
      return s.length <= width ? s : s.slice(0, width - 1) + '…';
    }

    function escAttr(text) {
      return String(text).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                         .replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function span(cls, text, title) {
      const attr = title ? ` title="${escAttr(title)}"` : '';
      return `<span class="val-${cls}"${attr}>${text}</span>`;
    }

    function progressBar(pct) {
      const filled = Math.min(10, Math.floor(pct * 10 / 100));
      const bar = '█'.repeat(filled) + '░'.repeat(10 - filled);
      const cls = pct >= 81 ? 'red' : pct >= 61 ? 'amber' : 'green';
      return span(cls, bar);
    }

    function pctSpan(pct) {
      const cls = pct >= 81 ? 'red' : pct >= 61 ? 'amber' : 'green';
      return span(cls, String(pct).padStart(3) + '%');
    }

    function formatUptime(secs) {
      const d = Math.floor(secs / 86400);
      const h = Math.floor((secs % 86400) / 3600);
      const m = Math.floor((secs % 3600) / 60);
      return `${d}d ${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m`;
    }

    function stateColor(state) {
      if (state === 'proposing' || state === 'full') return 'green';
      if (['connected', 'syncing', 'tracking'].includes(state)) return 'amber';
      return 'red';
    }

    // Build a two-column row: left col = 30 visible chars, right col = 34.
    function twoCol(left, right) {
      return `║${rpad(left, 30)}║${rpad(right, 34)}║`;
    }

    function buildAmendmentLines(amendments) {
      const H65 = '═'.repeat(65);
      const lines = [];

      if (amendments === null || amendments === undefined) {
        lines.push(`╔${H65}╗`);
        lines.push(`║${rpad(span('dim', '  retrieving...'), 65)}║`);
        lines.push(`╚${H65}╝`);
        return lines;
      }

      // Centered header
      const label = `PENDING AMENDMENTS (${amendments.length})`;
      const dashes = 65 - label.length - 2;
      const ldash = Math.floor(dashes / 2);
      const rdash = dashes - ldash;
      lines.push(`╔${H65}╗`);
      lines.push(`║${span('cyan', '─'.repeat(ldash) + ' ' + label + ' ' + '─'.repeat(rdash))}║`);

      if (amendments.length === 0) {
        lines.push(`║${rpad(span('dim', '  no pending amendments'), 65)}║`);
        lines.push(`╚${H65}╝`);
        return lines;
      }

      // Column headers
      lines.push(`║${rpad('  Name' + ' '.repeat(22) + 'Vote Status', 65)}║`);
      lines.push(`║${rpad('  ' + '─'.repeat(61), 65)}║`);

      for (const a of amendments) {
        const voteStr = a.vote === 'yes' ? span('green', 'YES') : span('red', 'NO ');
        let status, sCls;
        if (a.majority) {
          status = '★ MAJORITY'; sCls = 'amber';
        } else if (!a.supported) {
          status = 'pending · unsupported'; sCls = 'dim';
        } else {
          status = 'pending'; sCls = 'dim';
        }
        const row = `  ${rpad(a.name, 24)}  ${voteStr}  ${span(sCls, status)}`;
        lines.push(`║${rpad(row, 65)}║`);
      }

      lines.push(`╚${H65}╝`);
      return lines;
    }

    function buildLines(data) {
      const v = data.validator;
      const id = data.identity;
      const s = data.system;
      const n = data.network;
      const a = data.alerts;

      const H65 = '═'.repeat(65);
      const H30 = '═'.repeat(30);
      const H34 = '═'.repeat(34);
      const lines = [];

      // Header — 6-row block font banner, 59 visible chars each, 9-left 10-right pad
      const BANNER = [
        '██╗     ███████╗ ██████╗   ██╗  ██╗██████╗ ██████╗ ██╗     ',
        '██║     ██╔════╝██╔════╝   ╚██╗██╔╝██╔══██╗██╔══██╗██║     ',
        '██║     █████╗  ██║  ███╗   ╚███╔╝ ██████╔╝██████╔╝██║     ',
        '██║     ██╔══╝  ██║   ██║   ██╔██╗ ██╔══██╗██╔═══╝ ██║     ',
        '███████╗██║     ╚██████╔╝  ██╔╝ ██╗██║  ██║██║     ███████╗',
        '╚══════╝╚═╝      ╚═════╝   ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝     ╚══════╝',
      ];
      lines.push(`╔${H65}╗`);
      for (const row of BANNER) {
        lines.push(`║   ${span('magenta', row)}   ║`);
      }
      const sub = `▸▸  ${id.domain}  ·  ${id.public_key_short}  ◂◂`;
      const sp = Math.floor((65 - sub.length) / 2);
      lines.push(`║${' '.repeat(sp)}${span('white', sub)}${' '.repeat(65 - sub.length - sp)}║`);

      // Validator | System
      lines.push(`╠${H30}╦${H34}╣`);
      lines.push(twoCol(
        span('cyan', '─'.repeat(9) + ' VALIDATOR ' + '─'.repeat(10)),
        span('cyan', '─'.repeat(13) + ' SYSTEM ' + '─'.repeat(13))
      ));

      const sc = stateColor(v.state);
      lines.push(twoCol(`  state    ${span(sc, v.state)}`,
                        `  CPU  ${progressBar(s.cpu_pct)} ${pctSpan(s.cpu_pct)}`));
      lines.push(twoCol(`  ledger   ${span('white', String(v.ledger_seq))}`,
                        `  RAM  ${progressBar(s.ram_pct)} ${span(s.ram_pct >= 81 ? 'red' : s.ram_pct >= 61 ? 'amber' : 'green', s.ram_used_gb + '/' + s.ram_total_gb + 'G')}`));
      lines.push(twoCol(`  node up  ${span('green', formatUptime(v.rippled_uptime_s))}`,
                        `  Disk ${progressBar(s.disk_pct)} ${pctSpan(s.disk_pct)}`));
      const loadCls = v.load_factor > 1.0 ? 'amber' : 'green';
      lines.push(twoCol(`  load     ${span(loadCls, v.load_factor.toFixed(2))}`,
                        `  Up   ${span('green', formatUptime(s.uptime_s))}`));
      const peerCls = v.peers < 4 ? 'red' : v.peers < 10 ? 'amber' : 'green';
      const tCls = s.cpu_temp_c >= 80 ? 'red' : s.cpu_temp_c >= 60 ? 'amber' : 'green';
      const tempStr = s.cpu_temp_c !== null ? `  Temp ${span(tCls, s.cpu_temp_c + '°C')}` : '';
      lines.push(twoCol(`  peers    ${span(peerCls, String(v.peers))}`, tempStr));
      const cpuWStr = s.cpu_w !== null ? `  CPU W  ${span('white', s.cpu_w + 'W')}` : '';
      // Custom builds (e.g. "3.2.0-hamsa-manifest-filter.1") blow past the 30-char
      // left column and shove CPU W out of alignment — clip, keep full text on hover.
      const verLabel = '  version  ';
      const verFull = String(v.build_version);
      // -1 keeps a space before the column divider so a clipped value doesn't
      // butt against the border the way a full-width one would.
      const verText = clip(verFull, 30 - verLabel.length - 1);
      lines.push(twoCol(`${verLabel}${span('dim', verText, verText !== verFull ? verFull : null)}`,
                        cpuWStr));

      lines.push(`╚${H65}╝`);

      return lines;
    }

    function renderData(data) {
      document.getElementById('val-pre').innerHTML = buildLines(data).join('\n');
      document.getElementById('amd-pre').innerHTML =
        buildAmendmentLines(data.amendments).join('\n');
      document.getElementById('val-footer').textContent =
        `updated ${data.timestamp} · refreshing every 5s`;
    }

    async function fetchMetrics() {
      if (!METRICS_URL) {
        document.getElementById('val-pre').innerHTML =
            '<span class="val-dim">  METRICS_URL not configured.\n  Run:  bash motd/setup.sh</span>';
        document.getElementById('val-footer').textContent =
            'configure METRICS_URL to enable live data';
        return;
      }
      const controller = new AbortController();
      const tid = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
      try {
        const res = await fetch(METRICS_URL, { signal: controller.signal });
        clearTimeout(tid);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        lastData = data;
        lastSeenAt = new Date();
        document.getElementById('val-offline').style.display = 'none';
        document.getElementById('val-pre').classList.remove('val-dimmed');
        renderData(data);
      } catch (e) {
        clearTimeout(tid);
        if (lastSeenAt) {
          document.getElementById('val-last-seen').textContent = lastSeenAt.toUTCString();
          document.getElementById('val-offline').style.display = 'block';
          document.getElementById('val-pre').classList.add('val-dimmed');
          if (lastData) renderData(lastData);
        }
      }
    }

    fetchMetrics();
    setInterval(fetchMetrics, FETCH_INTERVAL_MS);
  </script>
</body>
</html>
