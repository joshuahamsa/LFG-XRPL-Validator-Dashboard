# Closes outage issues once the validator has recovered.
#
# Healthchecks.io's native GitHub integration OPENS an issue (label `outage`)
# each time the check goes down, but never closes it. This workflow polls the
# Healthchecks.io API with a read-only key, and for each open outage issue
# looks for the up-flip that followed its down-flip. If there is one, it
# comments with exact times + duration and closes the issue. See
# alerting/README.md.
#
# Note: GitHub disables scheduled workflows on public repos after 60 days with
# no commits. If outage issues stop auto-closing, re-enable it in the Actions tab.
name: Outage tracker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: outage-tracker
  cancel-in-progress: false

jobs:
  close-recovered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          HC_API_KEY: ${{ secrets.HC_API_KEY_READONLY }}
          HC_CHECK_ID: ${{ secrets.HC_CHECK_ID }}
        with:
          script: |
            const LABEL = 'outage';
            // The issue is created a few seconds after the down-flip; allow slack
            // for Healthchecks.io notification queueing.
            const MATCH_SLACK_MS = 10 * 60 * 1000;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            const open = await github.paginate(github.rest.issues.listForRepo,
              { ...repo, labels: LABEL, state: 'open', per_page: 100 });
            if (!open.length) { core.info('No open outage issues.'); return; }

            const { HC_API_KEY, HC_CHECK_ID } = process.env;
            if (!HC_API_KEY || !HC_CHECK_ID) {
              core.setFailed('Set repo secrets HC_API_KEY_READONLY and HC_CHECK_ID.');
              return;
            }
            const oldest = Math.min(...open.map(i => Date.parse(i.created_at)));
            // The flips API wants Unix seconds, not ISO dates.
            const start = Math.floor((oldest - 24 * 3600 * 1000) / 1000);
            const res = await fetch(
              `https://healthchecks.io/api/v3/checks/${HC_CHECK_ID}/flips/?start=${start}`,
              { headers: { 'X-Api-Key': HC_API_KEY } });
            if (!res.ok) { core.setFailed(`Healthchecks.io API returned ${res.status}`); return; }
            const flips = (await res.json()).flips
              .map(f => ({ t: Date.parse(f.timestamp), up: f.up === 1 }))
              .sort((a, b) => a.t - b.t);

            const fmt = ms => new Date(ms).toISOString().replace('.000Z', 'Z');
            const dur = ms => {
              const m = Math.round(ms / 60000);
              return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
            };

            for (const issue of open) {
              const created = Date.parse(issue.created_at);
              const down = flips.filter(f => !f.up && f.t <= created + MATCH_SLACK_MS).pop();
              if (!down) { core.warning(`#${issue.number}: no matching down-flip`); continue; }
              const up = flips.find(f => f.up && f.t > down.t);
              if (!up) { core.info(`#${issue.number}: still down since ${fmt(down.t)}`); continue; }

              await github.rest.issues.createComment({ ...repo, issue_number: issue.number, body: [
                `✅ **Recovered.** Down for **${dur(up.t - down.t)}**.`,
                '',
                `| | UTC |`, `|---|---|`,
                `| Went down | ${fmt(down.t)} |`,
                `| Back up | ${fmt(up.t)} |`,
                '',
                'For a silent outage (no check-ins at all), "went down" is when the grace period ran out; the real loss of connectivity was up to ~6 minutes earlier.',
              ].join('\n') });
              await github.rest.issues.update({ ...repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed' });
              core.info(`#${issue.number}: closed (${dur(up.t - down.t)})`);
            }
