# Opens a GitHub issue when Healthchecks.io reports the validator down and
# closes it (with duration) when it recovers. Fired by a Healthchecks.io
# webhook calling the repository_dispatch API — see alerting/README.md.
name: Outage tracker

on:
  repository_dispatch:
    types: [validator-down, validator-up]

permissions:
  issues: write

# Down and up events for one outage must never race each other.
concurrency:
  group: outage-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'outage';
            const p = context.payload.client_payload || {};
            const at = p.at || new Date().toISOString();
            const check = p.check || 'validator';
            const reason = (p.reason || '').trim()
              || 'No check-ins received: WAN, power, or host down (or the healthcheck timer stopped).';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            try {
              await github.rest.issues.createLabel({ ...repo, name: LABEL, color: 'b60205',
                description: 'Validator outage reported by Healthchecks.io' });
            } catch (e) { if (e.status !== 422) throw e; } // 422 = already exists

            const open = (await github.rest.issues.listForRepo({
              ...repo, labels: LABEL, state: 'open', per_page: 1,
              sort: 'created', direction: 'desc' })).data[0];

            if (context.payload.action === 'validator-down') {
              if (open) {
                // Healthchecks flipped down again before an up arrived; keep one issue.
                await github.rest.issues.createComment({ ...repo, issue_number: open.number,
                  body: `Still down / down again at **${at}**.\n\n> ${reason}` });
                return;
              }
              await github.rest.issues.create({ ...repo, labels: [LABEL],
                title: `Validator outage — ${at.slice(0, 16).replace('T', ' ')} UTC`,
                body: [
                  `**Check:** ${check}`,
                  `**Down since:** ${at}`,
                  `**Reason:** ${reason}`,
                  '',
                  'Opened automatically by Healthchecks.io; closes itself on recovery.',
                ].join('\n') });
              return;
            }

            // validator-up
            if (!open) { core.notice(`Recovery at ${at} with no open outage issue.`); return; }
            const mins = Math.max(0, Math.round((Date.parse(at) - Date.parse(open.created_at)) / 60000));
            const dur = mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`;
            await github.rest.issues.createComment({ ...repo, issue_number: open.number,
              body: `✅ Recovered at **${at}** — down for about **${dur}** (measured from first alert, so add the grace period).` });
            await github.rest.issues.update({ ...repo, issue_number: open.number,
              state: 'closed', state_reason: 'completed' });
